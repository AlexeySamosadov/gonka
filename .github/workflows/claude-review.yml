name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Run on PR events, or on @claude mentions in comments
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR according to the rules in CLAUDE.md.
            Focus on:
            1. Type safety (no bare int, explicit int64/uint64)
            2. DoS protection (upper limits on user inputs, validation before loops)
            3. Error handling (no panic/Must, proper error propagation)
            4. Resource leaks (context cancellation, goroutine cleanup)
            5. Performance (no full collection loads, use Walk())
            6. Test quality (real assertions, not just logging)
            7. PR hygiene (no unrelated files)

            Be specific and actionable. Reference the exact rule from CLAUDE.md when flagging an issue.
            Do NOT flag style nits or add praise — only flag real issues.
          claude_args: "--max-turns 5"
